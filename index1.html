<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title> Microbiology 
    </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg1: #0a0f1f; --bg2: #1a2639; --bg3: #2d3a4f;
            --primary: #4fc3f7; --primary-dark: #0288d1; --accent: #ffd54f;
            --danger: #ef5350; --success: #66bb6a;
            --text: #e2e8f0; --muted: #a0aec0;
            --radius: 16px; --shadow: 0 10px 30px rgba(0,0,0,0.4);
            --glow: 0 0 25px rgba(79,195,247,0.12);
            --max-width: 600px;
            --bg-card: rgba(255,255,255,0.06);
            --border-card: rgba(255,255,255,0.06);
        }
        body.light {
            --bg1: #ffffff; --bg2: #ffffff; --bg3: #ffffff;
            --bg-card: #ffffff; --border-card: #cccccc;
            --text: #000000; --muted: #555555;
            --primary: #1565c0; --primary-dark: #0d47a1;
            --accent: #f9a825; --danger: #c62828; --success: #2e7d32;
            --shadow: 0 2px 8px rgba(0,0,0,0.08); --glow: none;
            background: #ffffff !important; background-image: none !important;
        }
        body {
            font-family: "Tahoma", "Segoe UI", "Cairo", sans-serif;
            background: linear-gradient(-45deg, var(--bg1), var(--bg2), var(--bg3), #0f1a2b);
            background-size: 400% 400%;
            animation: gradientBG 18s ease infinite;
            min-height: 100vh; color: var(--text);
            display: flex; flex-direction: column; align-items: center;
            padding: 12px 10px; position: relative; overflow-x: hidden;
            transition: background 0.4s, color 0.3s;
        }
        @keyframes gradientBG { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
        body::before, body::after { content: ''; position: fixed; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(79,195,247,0.06) 0%, transparent 70%); animation: floatBubble 20s infinite alternate ease-in-out; pointer-events: none; z-index: 0; }
        body::before { top: 5%; left: -5%; }
        body::after { bottom: 5%; right: -5%; animation-delay: 4s; }
        @keyframes floatBubble { 0%{transform:translate(0,0) scale(1);} 100%{transform:translate(30px,-30px) scale(1.15);} }
        .app { width: 100%; max-width: var(--max-width); position: relative; z-index: 1; }
        .top-header { text-align: center; padding: 8px 0 4px; animation: fadeInDown 0.6s ease; }
        .top-header h1 { font-size: 1.8rem; font-weight: 800; text-shadow: 0 4px 15px rgba(79,195,247,0.25); background: linear-gradient(135deg, var(--primary), var(--primary-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        body.light .top-header h1 { background: none; -webkit-text-fill-color: unset; color: #000; text-shadow: none; }
        .top-header .sub { font-size: 0.9rem; color: var(--primary); font-weight: 600; letter-spacing: 0.5px; margin-top: 2px; }
        .top-header .creator { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
        .top-header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle-wrap { display: flex; justify-content: flex-end; margin-bottom: 6px; }
        .theme-toggle { display: flex; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 30px; padding: 3px; gap: 2px; box-shadow: var(--shadow); }
        .theme-toggle button { background: transparent; border: none; padding: 4px 14px; border-radius: 30px; font-size: 0.8rem; color: var(--muted); cursor: pointer; transition: 0.3s; }
        .theme-toggle button.active { background: var(--primary); color: #fff; font-weight: 700; box-shadow: 0 2px 12px rgba(79,195,247,0.25); }
        .card { background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border-card); border-radius: var(--radius); box-shadow: var(--shadow), var(--glow); padding: 16px 14px; margin-bottom: 14px; transition: transform 0.2s ease; animation: fadeInUp 0.5s ease both; color: var(--text); }
        body.light .card { background: #ffffff; border: 1px solid #cccccc; backdrop-filter: none; }
        .card:hover { transform: translateY(-2px); }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
        @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px);} to{opacity:1;transform:translateY(0);} }
        .card-title { margin: 0 0 12px; font-size: 1rem; color: var(--text); border-inline-start: 3px solid var(--primary); padding-inline-start: 10px; font-weight: 600; }
        .card-title i { color: var(--accent); margin-left: 6px; }
        .action-icons { display: flex; justify-content: space-around; gap: 6px; flex-wrap: wrap; }
        .action-icon { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 6px 14px; border-radius: 12px; transition: 0.25s; border: 1.5px solid transparent; background: transparent; color: var(--muted); font-size: 0.7rem; font-weight: 600; min-width: 56px; }
        .action-icon .icon { font-size: 1.5rem; }
        .action-icon.active { border-color: var(--primary); background: rgba(79,195,247,0.08); box-shadow: 0 0 20px rgba(79,195,247,0.12); }
        .action-icon:hover { background: rgba(255,255,255,0.04); }
        .sub-options { display: none; padding: 8px 10px; margin-top: 6px; background: rgba(0,0,0,0.15); border-radius: 12px; border: 1px solid var(--border-card); flex-wrap: wrap; gap: 6px; justify-content: center; transition: 0.3s; }
        body.light .sub-options { background: #f5f5f5; border-color: #cccccc; }
        .sub-options.show { display: flex; }
        .sub-options .action-btn { border: 1px solid var(--border-card); background: rgba(255,255,255,0.03); border-radius: 12px; padding: 5px 16px; font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        body.light .sub-options .action-btn { background: #ffffff; border-color: #cccccc; color: #333; }
        .sub-options .action-btn:hover { border-color: var(--primary); background: rgba(79,195,247,0.06); transform: translateY(-1px); }
        .sub-options .action-btn.active { border-color: var(--primary); background: rgba(79,195,247,0.12); color: var(--text); box-shadow: 0 0 16px rgba(79,195,247,0.08); }
        .section-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; padding-inline-end: 2px; }
        .section-item { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border-card); border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: all 0.15s ease; font-size: 0.85rem; color: var(--text); }
        body.light .section-item { border-color: #cccccc; }
        .section-item:hover { background: rgba(255,255,255,0.04); border-color: rgba(79,195,247,0.2); }
        .section-item.active { border-color: var(--primary); background: rgba(79,195,247,0.08); }
        .section-item .cnt { background: rgba(255,255,255,0.06); border-radius: 30px; padding: 0 10px; font-size: 0.7rem; color: var(--muted); font-weight: 700; min-width: 30px; text-align: center; }
        body.light .section-item .cnt { background: #dddddd; color: #333; }
        .section-item.active .cnt { background: var(--primary); color: #fff; }
        .section-item .info-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0 4px; transition: color 0.2s; }
        .section-item .info-btn:hover { color: var(--primary); }
        #section-explanation { margin-top: 12px; padding: 16px; background: rgba(0,0,0,0.15); border-radius: var(--radius); border: 1px solid var(--border-card); display: none; animation: fadeInUp 0.3s ease; }
        #section-explanation.show { display: block; }
        .explain-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .explain-header h3 { color: var(--text); font-size: 1rem; margin: 0; }
        .explain-controls { display: flex; gap: 6px; align-items: center; }
        .explain-controls .lang-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border-card); color: var(--muted); padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        body.light .explain-controls .lang-btn { background: #ffffff; border-color: #cccccc; color: #333; }
        .explain-controls .lang-btn.active { border-color: var(--primary); background: rgba(79,195,247,0.12); color: var(--text); }
        .explain-controls .close-explain { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 0 4px; }
        .explain-controls .close-explain:hover { color: var(--danger); }
        #explain-text { font-size: 0.9rem; line-height: 2; color: var(--text); background: rgba(0,0,0,0.1); padding: 12px; border-radius: 10px; min-height: 60px; direction: ltr; text-align: left; white-space: pre-wrap; }
        body.light #explain-text { background: #ffffff; color: #000; border: 1px solid #cccccc; }
        #explain-text.ar { direction: rtl; text-align: right; font-family: "Cairo","Tahoma",sans-serif; }
        #explain-text.en { direction: ltr; text-align: left; }
        .big-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(79,195,247,0.25); transition: all 0.15s ease; position: relative; overflow: hidden; letter-spacing: 0.3px; }
        body.light .big-btn { background: #1565c0; color: #fff; box-shadow: 0 2px 8px rgba(21,101,192,0.3); }
        .big-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 28px rgba(79,195,247,0.35); }
        .big-btn:active { transform: scale(0.97); }
        .big-btn.secondary { background: linear-gradient(135deg, #4a5568, #2d3748); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        body.light .big-btn.secondary { background: #757575; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .big-btn.warn { background: linear-gradient(135deg, var(--accent), #f57f17); box-shadow: 0 6px 20px rgba(255,213,79,0.25); }
        body.light .big-btn.warn { background: #f9a825; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .big-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .stats-row { display: flex; justify-content: space-around; gap: 8px; text-align: center; margin: 6px 0; }
        .stats-row .stat .num { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), #81d4fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        body.light .stats-row .stat .num { background: none; -webkit-text-fill-color: unset; color: #000; }
        .stats-row .stat .lbl { font-size: 0.7rem; color: var(--muted); }
        .progress-stats { display: flex; align-items: center; gap: 16px; }
        .progress-ring { position: relative; width: 70px; height: 70px; flex-shrink: 0; }
        .progress-ring svg { transform: rotate(-90deg); width: 70px; height: 70px; }
        .progress-ring .bg { fill: none; stroke: var(--border-card); stroke-width: 6; }
        .progress-ring .fg { fill: none; stroke: var(--primary); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 176; transition: stroke-dashoffset 0.6s ease; }
        .progress-ring .center-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: var(--text); }
        .progress-ring .center-text small { font-size: 0.5rem; font-weight: 400; color: var(--muted); margin-right: 1px; }
        .weak-link { margin-top: 10px; font-size: 0.75rem; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .weak-link i { color: var(--accent); }
        .weak-link:hover { color: var(--text); }
        .action-row-bottom { display: flex; gap: 8px; margin-top: 10px; }
        .action-row-bottom .big-btn { flex: 1; font-size: 0.75rem; padding: 8px; margin-top: 0; }
        #screen-quiz, #screen-results { display: none; }
        #screen-quiz.active, #screen-results.active { display: block; }
        .quiz-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
        #timer-badge { font-weight: 600; font-size: 0.8rem; background: rgba(255,255,255,0.05); padding: 2px 12px; border-radius: 30px; border: 1px solid var(--border-card); }
        #timer-badge.warn { background: rgba(255,213,79,0.15); border-color: var(--accent); color: var(--accent); }
        #timer-badge.danger { background: rgba(239,83,80,0.2); border-color: var(--danger); color: var(--danger); animation: pulse 0.7s infinite alternate; }
        @keyframes pulse { 0%{opacity:1;} 100%{opacity:0.5;} }
        .progress-wrap { background: rgba(255,255,255,0.06); border-radius: 30px; height: 4px; overflow: hidden; margin-bottom: 12px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.3s ease; }
        .q-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
        .q-tag { display: inline-block; background: rgba(79,195,247,0.10); color: var(--primary); font-size: 0.65rem; font-weight: 700; padding: 2px 12px; border-radius: 30px; border: 1px solid rgba(79,195,247,0.06); margin-bottom: 8px; }
        .q-en { font-size: 1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.6; direction: ltr; text-align: left; word-wrap: break-word; }
        .q-ar { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; line-height: 1.7; direction: rtl; text-align: right; }
        .options { display: flex; flex-direction: column; gap: 8px; }
        .option { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-card); border-radius: 12px; padding: 10px 14px; cursor: pointer; transition: all 0.15s ease; background: rgba(255,255,255,0.02); position: relative; direction: ltr; }
        body.light .option { background: #ffffff; border-color: #cccccc; }
        .option:hover { border-color: rgba(79,195,247,0.25); background: rgba(255,255,255,0.04); }
        .option .opt-en { font-weight: 600; color: var(--text); font-size: 0.9rem; flex: 1; direction: ltr; text-align: left; }
        .option .opt-ar { color: var(--muted); font-size: 0.8rem; direction: rtl; text-align: right; flex: 1; }
        .option .mark { font-size: 1.1rem; width: 24px; text-align: center; flex-shrink: 0; }
        .option.selected { border-color: var(--primary); background: rgba(79,195,247,0.06); }
        .option.correct { border-color: var(--success); background: rgba(102,187,106,0.08); }
        .option.wrong { border-color: var(--danger); background: rgba(239,83,80,0.08); }
        .option.disabled { cursor: default; opacity: 0.8; }
        .feedback-box { margin-top: 12px; padding: 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.6; animation: fadeInUp 0.25s ease; }
        .feedback-box.correct { background: rgba(102,187,106,0.08); border: 1px solid rgba(102,187,106,0.15); color: #a7f3d0; }
        .feedback-box.wrong { background: rgba(239,83,80,0.08); border: 1px solid rgba(239,83,80,0.15); color: #fecaca; }
        body.light .feedback-box.correct { background: #e8f5e9; border-color: #2e7d32; color: #000; }
        body.light .feedback-box.wrong { background: #ffebee; border-color: #c62828; color: #000; }
        .feedback-box .fb-title { font-weight: 700; margin-bottom: 4px; }
        .feedback-box .fb-explain { color: var(--muted); }
        .nav-row { display: flex; gap: 8px; margin-top: 12px; }
        .nav-row .big-btn { flex: 1; margin-top: 0; font-size: 0.85rem; padding: 10px; }
        .score-circle { width: 120px; height: 120px; border-radius: 50%; margin: 8px auto 14px; display: flex; align-items: center; justify-content: center; flex-direction: column; background: conic-gradient(var(--primary) calc(var(--pct)*1%), rgba(255,255,255,0.04) 0); position: relative; box-shadow: 0 0 40px rgba(79,195,247,0.10); }
        .score-circle::before { content: ""; position: absolute; width: 90px; height: 90px; background: var(--bg1); backdrop-filter: blur(4px); border-radius: 50%; opacity: 0.85; }
        .score-circle .pct { position: relative; font-size: 1.8rem; font-weight: 900; color: #fff; }
        .score-circle .lbl { position: relative; font-size: 0.7rem; color: var(--muted); }
        .mistake-item { border: 1px solid var(--border-card); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.02); }
        .mistake-item .m-q { font-weight: 700; margin-bottom: 2px; }
        .mistake-item .m-you { color: var(--danger); font-size: 0.8rem; }
        .mistake-item .m-correct { color: var(--success); font-size: 0.8rem; }
        .mistake-toggle { background: none; border: 1px solid var(--border-card); border-radius: 8px; padding: 4px 12px; cursor: pointer; color: var(--text); font-size: 0.75rem; transition: all 0.2s; margin-top: 6px; }
        .mistake-toggle:hover { background: rgba(79,195,247,0.08); border-color: var(--primary); }
        .mistake-detail { margin-top: 10px; border: 1px solid var(--border-card); border-radius: 10px; padding: 12px; background: rgba(255,255,255,0.03); animation: fadeInUp 0.25s ease; }
        .mistake-detail .opt-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border-card); }
        .mistake-detail .opt-row:last-child { border-bottom: none; }
        .mistake-detail .opt-label { flex: 1; }
        .mistake-detail .opt-status { font-size: 1rem; margin-right: 8px; }
        .hidden { display: none !important; }
        footer { text-align: center; color: var(--muted); font-size: 0.7rem; margin-top: 20px; margin-bottom: 8px; letter-spacing: 0.5px; opacity: 0.6; }
        footer .name { color: var(--primary); font-weight: 700; }
        .word-en { display: inline-block; cursor: default; transition: background 0.15s, transform 0.1s; padding: 1px 2px; border-radius: 4px; direction: ltr; unicode-bidi: embed; }
        .word-en:active { background: rgba(79,195,247,0.15); transform: scale(0.97); }
        .word-en.speaking { background: rgba(255,213,79,0.25); box-shadow: 0 0 10px rgba(255,213,79,0.2); }
        .speech-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); color: #fff; padding: 6px 18px; border-radius: 30px; font-size: 0.8rem; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; z-index: 999; border: 1px solid rgba(255,255,255,0.1); }
        .speech-hint.show { opacity: 1; }
        .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.25); transform: scale(0); animation: rippleAnim 0.5s linear; pointer-events: none; }
        @keyframes rippleAnim { to{transform:scale(3);opacity:0;} }
        .tf-badge { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 1px 8px; border-radius: 12px; margin-right: 6px; background: rgba(79,195,247,0.15); color: var(--primary); }
        @media (max-width:480px) {
            body { padding: 8px 6px; } .app { max-width: 100%; }
            .top-header h1 { font-size: 1.5rem; } .card { padding: 12px 10px; }
            .action-icon { padding: 4px 8px; min-width: 44px; }
            .action-icon .icon { font-size: 1.2rem; }
            .q-en { font-size: 0.9rem; } .option { padding: 8px 10px; }
            .big-btn { font-size: 0.85rem; padding: 10px; }
            .score-circle { width: 100px; height: 100px; }
            .score-circle::before { width: 75px; height: 75px; }
            .score-circle .pct { font-size: 1.5rem; }
            .progress-ring { width: 56px; height: 56px; }
            .progress-ring svg { width: 56px; height: 56px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-header">
        <h1>
            بنك المايكروبيولجي (مهم جدا)
        
        </h1>
        <div class="sub">Microbiology QBank 
        
    </div>
        <div class="creator"><i class="fas fa-user-graduate"></i> Created by <span class="name">MR. YASSIN THARWAT</span></div>
    </div>
    <div class="theme-toggle-wrap">
        <div class="theme-toggle" id="themeToggle">
            <button class="active" data-theme="dark" onclick="setTheme('dark')"><i class="fas fa-moon"></i></button>
            <button data-theme="light" onclick="setTheme('light')"><i class="fas fa-sun"></i></button>
        </div>
    </div>
    <div id="main-screen">
        <div class="card">
            <div class="card-title"><i class="fas fa-sliders-h"></i> الإجراءات</div>
            <div class="action-icons">
                <div class="action-icon active" data-target="modeOptions" onclick="toggleOptions('modeOptions')"><span class="icon">🎯</span><span class="label">المذاكرة</span></div>
                <div class="action-icon" data-target="orderOptions" onclick="toggleOptions('orderOptions')"><span class="icon">🔀</span><span class="label">الترتيب</span></div>
                <div class="action-icon" data-target="langOptions" onclick="toggleOptions('langOptions')"><span class="icon">🌐</span><span class="label">اللغة</span></div>
                <div class="action-icon" data-target="timerOptions" onclick="toggleOptions('timerOptions')"><span class="icon">⏱️</span><span class="label">المؤقت</span></div>
            </div>
            <div id="modeOptions" class="sub-options show">
                <button class="action-btn active" data-mode="practice" onclick="selectMode('practice')">تدريب</button>
                <button class="action-btn" data-mode="test" onclick="selectMode('test')">اختبار</button>
            </div>
            <div id="orderOptions" class="sub-options">
                <button class="action-btn active" data-order="device" onclick="selectOrder('device')">بالترتيب</button>
                <button class="action-btn" data-order="random" onclick="selectOrder('random')">عشوائي</button>
            </div>
            <div id="langOptions" class="sub-options">
                <button class="action-btn active" data-translate="yes" onclick="selectTranslate('yes')">ترجمة</button>
                <button class="action-btn" data-translate="no" onclick="selectTranslate('no')">EN</button>
            </div>

        { num:14, en:"One of the following diseases is sexually transmitted:", ar:"أحد الأمراض التالية ينتقل جنسياً:", options:[{en:"A. Syphilis",ar:"أ. الزهري",correct:true},{en:"B. Gas gangrene",ar:"ب. الغرغرينا الغازية",correct:false},{en:"C. Diphtheria",ar:"ج. الدفتيريا",correct:false},{en:"D. Tetanus",ar:"د. الكزاز",correct:false}], explain_ar:"الزهري ينتقل جنسياً." },
        { num:15, en:"One of the followings is not a character of clostridium tetani:", ar:"أحد ما يلي ليس من خصائص المطثية الكزازية:", options:[{en:"A. Have spores",ar:"أ. لها أبواغ",correct:false},{en:"B. Drum-stick appearance",ar:"ب. مظهر عصا الطبل",correct:false},{en:"C. They are aerobes",ar:"ج. هي هوائية",correct:true},{en:"D. They are producer of powerful exotoxin",ar:"د. تنتج ذيفاناً خارجياً قوياً",correct:false}], explain_ar:"المطثية الكزازية لاهوائية." },
        { num:16, en:"In case of respiratory tract infection. The following sample should be examined:", ar:"في حالة عدوى الجهاز التنفسي، أي عينة يجب فحصها؟", options:[{en:"A. Urine",ar:"أ. البول",correct:false},{en:"B. Stool",ar:"ب. البراز",correct:false},{en:"C. Sputum",ar:"ج. البلغم",correct:true},{en:"D. Pus",ar:"د. القيح",correct:false}], explain_ar:"البلغم للجهاز التنفسي." },
        { num:17, en:"In examination of urine sample. The following precautions are essential:", ar:"في فحص عينة البول، أي من الاحتياطات التالية ضرورية؟", options:[{en:"A. Morning sample",ar:"أ. عينة الصباح",correct:false},{en:"B. Clean skin around urethra",ar:"ب. تنظيف الجلد حول الإحليل",correct:false},{en:"C. Mid-stream",ar:"ج. منتصف التدفق",correct:false},{en:"D. All of the above",ar:"د. كل ما سبق",correct:true}], explain_ar:"جميعها ضرورية." },
        { num:18, en:"Swabs are appropriate for specimens collected from all the following sites EXCEPT:", ar:"المسحات مناسبة للعينات المأخوذة من جميع المواقع التالية ما عدا:", options:[{en:"A. Nasal",ar:"أ. الأنف",correct:false},{en:"B. Ear",ar:"ب. الأذن",correct:false},{en:"C. Urine",ar:"ج. البول",correct:true},{en:"D. Nasopharynx",ar:"د. البلعوم الأنفي",correct:false}], explain_ar:"البول ليس مسحة." },
        { num:19, en:"Urine sample used for a urine culture is:", ar:"عينة البول المستخدمة للزراعة هي:", options:[{en:"A. The first portion of the urine",ar:"أ. الجزء الأول من البول",correct:false},{en:"B. Mid-stream urine",ar:"ب. منتصف التدفق",correct:true},{en:"C. Last portion of urine",ar:"ج. الجزء الأخير",correct:false},{en:"D. Whole urine collected",ar:"د. البول كاملاً",correct:false}], explain_ar:"منتصف التدفق." },
        { num:20, en:"Important precautions should be taken in collecting clinical specimens includes a label firmly attached to the container with the following information:", ar:"الاحتياطات الهامة في جمع العينات تشمل ملصقاً مثبتاً بإحكام يحتوي على:", options:[{en:"A. Sex",ar:"أ. الجنس",correct:false},{en:"B. Name",ar:"ب. الاسم",correct:false},{en:"C. Age",ar:"ج. العمر",correct:false},{en:"D. All of the above",ar:"د. كل ما سبق",correct:true}], explain_ar:"جميعها." },
        { num:21, en:"When instructing the patient to collect a sputum specimen, the medical assistant should tell the patient to:", ar:"عند توجيه المريض لجمع عينة بلغم، يجب إخباره بـ:", options:[{en:"A. Best to collect sputum specimens in the evening",ar:"أ. الأفضل جمعها في المساء",correct:false},{en:"B. Collect sputum from a first morning coughing episode",ar:"ب. جمع البلغم من نوبة السعال الصباحية الأولى",correct:true},{en:"C. Allow saliva and mouth mucus to enter cup",ar:"ج. السماح بدخول اللعاب والمخاط الفموي",correct:false},{en:"D. Sputum culture can be done from saliva",ar:"د. يمكن زرع البلغم من اللعاب",correct:false}], explain_ar:"أفضل عينة هي صباحية." },
        { num:22, en:"When you come to collect a blood culture specimen:", ar:"عند جمع عينة زرع الدم:", options:[{en:"A. Skin must then be decontaminated with a 10% alcohol",ar:"أ. يجب تطهير الجلد بكحول 10%",correct:false},{en:"B. Use blood culture bottles aerobic only",ar:"ب. استخدام زجاجات هوائية فقط",correct:false},{en:"C. The specimen should preferably be taken during fever episodes",ar:"ج. تؤخذ العينة أثناء نوبات الحمى",correct:true},{en:"D. Re-palpate vein after decontamination",ar:"د. إعادة جس الوريد بعد التطهير",correct:false}], explain_ar:"تؤخذ أثناء الحمى." },
        { num:23, en:"When you come to collect a wound swab:", ar:"عند جمع مسحة جرح:", options:[{en:"A. Obtain the specimen after use of antiseptic",ar:"أ. أخذ العينة بعد استخدام المطهر",correct:false},{en:"B. Usually very small amount of pus is sufficient",ar:"ب. عادة كمية صغيرة جداً من القيح كافية",correct:false},{en:"C. Obtain the specimen prior to any dressing or cleaning procedure",ar:"ج. أخذ العينة قبل أي إجراء تضميد أو تنظيف",correct:true},{en:"D. It is better to have the sample after starting antibiotic therapy",ar:"د. من الأفضل أخذها بعد بدء المضاد الحيوي",correct:false}], explain_ar:"تؤخذ قبل التنظيف." },
        { num:24, en:"Throat swab should be taken from:", ar:"مسحة الحلق تؤخذ من:", options:[{en:"A. Nasopharynx",ar:"أ. البلعوم الأنفي",correct:false},{en:"B. Nostril",ar:"ب. فتحة الأنف",correct:false},{en:"C. The posterior pharynx and tonsillar area",ar:"ج. البلعوم الخلفي ومنطقة اللوزتين",correct:true},{en:"D. Cheeks, teeth or gums",ar:"د. الخدين أو الأسنان أو اللثة",correct:false}], explain_ar:"من البلعوم الخلفي واللوزتين." },
        { num:25, en:"When collecting sputum specimens, health professionals should use ........ as droplets and aerosols may be generated:", ar:"عند جمع عينات البلغم، يجب استخدام ........ لأن القطرات والهباء الجوي قد يتولدان:", options:[{en:"A. Full PPE",ar:"أ. معدات الوقاية الكاملة",correct:true},{en:"B. Mask only",ar:"ب. كمامة فقط",correct:false},{en:"C. Gloves only",ar:"ج. قفازات فقط",correct:false},{en:"D. Nothing",ar:"د. لا شيء",correct:false}], explain_ar:"معدات الوقاية الكاملة." },
        { num:26, en:"What is wrong about blood culture sampling:", ar:"ما هو الخطأ في أخذ عينة زرع الدم؟", options:[{en:"A. Skin must then be decontaminated with a 70% alcohol",ar:"أ. يجب تطهير الجلد بكحول 70%",correct:false},{en:"B. Do not re-palpate vein after decontamination",ar:"ب. لا تعاود جس الوريد بعد التطهير",correct:false},{en:"C. Use aerobic blood culture bottle only",ar:"ج. استخدام زجاجة هوائية فقط",correct:true},{en:"D. Discard the needle in safety box",ar:"د. التخلص من الإبرة في صندوق الأمان",correct:false}], explain_ar:"يجب استخدام هوائية ولا هوائية." },
        { num:27, en:"Streptococcal pyogenes give beta haemolysis on blood agar.", ar:"المكورات العقدية المقيحة تعطي انحلالاً بيتا على أجار الدم.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:28, en:"Diphtheria vaccine is in the form of toxin.", ar:"لقاح الدفتيريا يكون على شكل ذيفان.", isTF:true, correct:false, explain_ar:"خطأ، هو ذيفان (toxoid) وليس ساماً." },
        { num:29, en:"Whooping cough vaccine is living vaccine.", ar:"لقاح السعال الديكي هو لقاح حي.", isTF:true, correct:false, explain_ar:"خطأ، هو لقاح ميت (خلوي أو لاخلوي)." },
        { num:30, en:"Post streptococcal complications are caused by the organism itself.", ar:"المضاعفات التالية للعقديات تسببها الكائنات نفسها.", isTF:true, correct:false, explain_ar:"خطأ، بسبب تفاعل مناعي." },
        { num:31, en:"Rheumatic fever is a complication off streptococcal tonsillitis.", ar:"الحمى الروماتيزمية هي مضاعفة لالتهاب اللوزتين العقدي.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:32, en:"Upper respiratory tract infection means bronchitis and pneumonia.", ar:"عدوى الجهاز التنفسي العلوي تعني التهاب الشعب والرئتين.", isTF:true, correct:false, explain_ar:"خطأ، العلوي يشمل الأنف والبلعوم والحنجرة." },
        { num:33, en:"Gonorrhea and syphilis are sexually transmitted diseases.", ar:"السيلان والزهري من الأمراض المنقولة جنسياً.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:34, en:"Secondary stage of syphilis is manifested by chancre.", ar:"المرحلة الثانوية من الزهري تظهر بالقرحة.", isTF:true, correct:false, explain_ar:"خطأ، القرحة (شانكر) في المرحلة الأولية." },
        { num:35, en:"Neisseria gonorrhea is intracellular gram -ve diplococci.", ar:"النيسيريا البنية هي مكورات ثنائية سالبة الجرام داخل خلوية.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:36, en:"Clostridia which cause gas gangrene produce gas.", ar:"المطثيات المسببة للغرغرينا الغازية تنتج غازاً.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:37, en:"Treponema pallidum is stained easily by Gram stain.", ar:"اللولبية الشاحبة تتلون بسهولة بصبغة جرام.", isTF:true, correct:false, explain_ar:"خطأ، لا تتلون." },
        { num:38, en:"Clostridium tetani are spore forming bacilli.", ar:"المطثية الكزازية هي عصيات مكونة للأبواغ.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:39, en:"The culture specimens should be collected before the initiation of antibiotic treatment.", ar:"يجب جمع عينات الزرع قبل بدء العلاج بالمضادات الحيوية.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:40, en:"In nasopharyngeal swab a dry swab is inserted 2 cm into the nostril.", ar:"في مسحة البلعوم الأنفي، تُدخل مسحة جافة 2 سم في فتحة الأنف.", isTF:true, correct:false, explain_ar:"خطأ، تُدخل حتى البلعوم الخلفي." },
        { num:41, en:"In patients suspected to have pulmonary Tuberculosis one specimens is sufficient.", ar:"في المرضى المشتبه بإصابتهم بالسل الرئوي، عينة واحدة كافية.", isTF:true, correct:false, explain_ar:"خطأ، تؤخذ 3 عينات." },
        { num:42, en:"When inoculating the blood culture bottles the anaerobic culture bottle should be inoculated first and then the aerobic culture bottle.", ar:"عند تلقيح زجاجات زرع الدم، تلقح الزجاجة اللاهوائية أولاً ثم الهوائية.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:43, en:"The blood culture specimen should preferably be taken during fever episodes.", ar:"يفضل أخذ عينة زرع الدم أثناء نوبات الحمى.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:44, en:"Alcohol is used as a skin antiseptic.", ar:"الكحول يُستخدم كمطهر للجلد.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:45, en:"Surgical instruments is sterilized by autoclave.", ar:"الأدوات الجراحية تُعقم بالأوتوكلاف.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:46, en:"Herpes simplex virus may infect the conjunctiva or the cornea.", ar:"فيروس الهربس البسيط قد يصيب الملتحمة أو القرنية.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:47, en:"Sabin vaccine is a killed virus vaccine.", ar:"لقاح سابين هو لقاح فيروسي ميت.", isTF:true, correct:false, explain_ar:"خطأ، هو لقاح حي مضعف." },
        // الأسئلة المفقودة أرقام 48-50
        { num:48, en:"Bordetella which cause whooping cough are gram positive bacilli.", ar:"البورديتيلا المسببة للسعال الديكي هي عصيات موجبة الجرام.", isTF:true, correct:false, explain_ar:"خطأ، البورديتيلا سالبة الجرام." },
        { num:49, en:"Streptococcal tonsillitis is characterized by a pyogenic reaction on the surface of the tonsil.", ar:"التهاب اللوزتين العقدي يتميز بتفاعل قيحي على سطح اللوزة.", isTF:true, correct:true, explain_ar:"صحيح، التهاب اللوزتين العقدي يسبب تفاعلًا قيحيًا." },
        { num:50, en:"Rheumatic fever and nephritis are complications of TB infection.", ar:"الحمى الروماتيزمية والتهاب الكلى من مضاعفات عدوى السل.", isTF:true, correct:false, explain_ar:"خطأ، هي مضاعفات عدوى المكورات العقدية وليس السل." }

        { num:2, en:"All of the following are characters of Hepatitis virus (A) EXCEPT:", ar:"جميع ما يلي من خصائص فيروس التهاب الكبد A ما عدا:", options:[{en:"A. Transmitted by the fecal-oral route",ar:"أ. ينتقل عن طريق الفم-الشرج",correct:false},{en:"B. Ingestion of contaminated food or water",ar:"ب. تناول طعام أو ماء ملوث",correct:false},{en:"C. Turn to chronic infection",ar:"ج. يتحول إلى عدوى مزمنة",correct:true},{en:"D. No carriers",ar:"د. لا يوجد حاملون",correct:false}], explain_ar:"التهاب الكبد A لا يصبح مزمناً." },

        { num:4, en:"All of the following are characters of Hepatitis virus (B) EXCEPT:", ar:"جميع ما يلي من خصائص فيروس التهاب الكبد B ما عدا:", options:[{en:"A. No vaccine for prophylaxis",ar:"أ. لا يوجد لقاح للوقاية",correct:true},{en:"B. Transmitted by blood, sexual intercourse and perinatally",ar:"ب. ينتقل بالدم والجماع والولادة",correct:false},{en:"C. Chronic carriers",ar:"ج. حاملون مزمنون",correct:false},{en:"D. Leads to cirrhosis of the liver and HCC",ar:"د. يؤدي إلى تليف الكبد وسرطان الكبد",correct:false}], explain_ar:"يوجد لقاح لـ B." },
        { num:5, en:"All of the following are characters of Hepatitis virus (D) EXCEPT:", ar:"جميع ما يلي من خصائص فيروس التهاب الكبد D ما عدا:", options:[{en:"A. Co-infection with HBV",ar:"أ. عدوى مشتركة مع HBV",correct:false},{en:"B. No chronic liver disease",ar:"ب. لا يوجد مرض كبدي مزمن",correct:true},{en:"C. Super-infection of an already HBV-infected individual",ar:"ج. عدوى فوقية لشخص مصاب بالفعل بـ HBV",correct:false},{en:"D. Prevented by HBV prophylaxis",ar:"د. تُمنع بالوقاية من HBV",correct:false}], explain_ar:"D يسبب مرضاً مزمناً." },
        { num:6, en:"All of the following are characters of Hepatitis virus (C) EXCEPT:", ar:"جميع ما يلي من خصائص فيروس التهاب الكبد C ما عدا:", options:[{en:"A. Post-transfusion hepatitis",ar:"أ. التهاب الكبد التالي لنقل الدم",correct:false},{en:"B. Available active or passive immunization",ar:"ب. يوجد تحصين فعال أو سلبي",correct:true},{en:"C. Transmitted parenterally and perinatally",ar:"ج. ينتقل بالحقن والولادة",correct:false},{en:"D. Chronic active hepatitis",ar:"د. التهاب كبد نشط مزمن",correct:false}], explain_ar:"لا يوجد لقاح لـ C." },
        { num:7, en:"Viruses can replicate inside the living and non-living cells.", ar:"الفيروسات يمكنها التكاثر داخل الخلايا الحية وغير الحية.", isTF:true, correct:false, explain_ar:"خطأ، تتكاثر في الخلايا الحية فقط." },
        { num:8, en:"The viruses possess only one type of nucleic acid.", ar:"الفيروسات تمتلك نوع واحد فقط من الحمض النووي.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:9, en:"Bacteria possess only one type of nucleic acid.", ar:"البكتيريا تمتلك نوع واحد فقط من الحمض النووي.", isTF:true, correct:false, explain_ar:"خطأ، البكتيريا تمتلك كلاً من DNA و RNA." },
        { num:10, en:"Viruses are ultramicroscopic, measured by nanometer (nm).", ar:"الفيروسات فائقة الصغر، تُقاس بالنانومتر.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:11, en:"Rabies is a bacterial disease transmitted by the bite of a rabid animal.", ar:"داء الكلب مرض بكتيري ينتقل عن طريق عضة حيوان مسعور.", isTF:true, correct:false, explain_ar:"خطأ، فيروسي." },
        { num:12, en:"Serum hepatitis disease could be transmitted from a mother to her baby.", ar:"التهاب الكبد المصلي يمكن أن ينتقل من الأم إلى طفلها.", isTF:true, correct:true, explain_ar:"صحيح (HBV)." },
        { num:13, en:"Yellow fever disease is caused by a bacterial microbe.", ar:"الحمى الصفراء يسببها ميكروب بكتيري.", isTF:true, correct:false, explain_ar:"خطأ، فيروسي." },
        { num:14, en:"There is no long lasting immunity after catching influenza disease.", ar:"لا توجد مناعة طويلة الأمد بعد الإصابة بالإنفلونزا.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:15, en:"Common cold is caused by the Influenza virus.", ar:"الزكام العادي يسببه فيروس الإنفلونزا.", isTF:true, correct:false, explain_ar:"خطأ، يسببه فيروسات مختلفة (رينو)." },
        { num:16, en:"Orchitis is a complication of the Mumps disease.", ar:"التهاب الخصية مضاعف لمرض النكاف.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:17, en:"Herpes zoster disease is a disease of children.", ar:"مرض الحزام الناري هو مرض يصيب الأطفال.", isTF:true, correct:false, explain_ar:"خطأ، يصيب كبار السن." },
        { num:18, en:"Herpes zoster is due to reactivation of the virus lying dormant in the patient.", ar:"الحزام الناري ناتج عن إعادة تنشيط الفيروس الكامن في المريض.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:19, en:"Hepatitis C Virus is a DNA virus.", ar:"فيروس التهاب الكبد C هو فيروس DNA.", isTF:true, correct:false, explain_ar:"خطأ، هو فيروس RNA." },
        { num:20, en:"The size of bacteria is measured in nanometers while the size of viruses is measured in microns.", ar:"حجم البكتيريا يُقاس بالنانومتر بينما حجم الفيروسات يُقاس بالميكرون.", isTF:true, correct:false, explain_ar:"خطأ، العكس." },
        { num:21, en:"Hepatitis A virus can be transmitted by blood transfusion.", ar:"فيروس التهاب الكبد A يمكن أن ينتقل عن طريق نقل الدم.", isTF:true, correct:false, explain_ar:"خطأ، ينتقل فموياً-شرجياً." },
        { num:22, en:"Hepatitis C virus leads to liver cirrhosis and HCC.", ar:"فيروس التهاب الكبد C يؤدي إلى تليف الكبد وسرطان الكبد.", isTF:true, correct:true, explain_ar:"صحيح." },
        { num:23, en:"Hepatitis D virus can be transmitted as coinfection with hepatitis E virus.", ar:"فيروس التهاب الكبد D يمكن أن ينتقل كعدوى مشتركة مع فيروس التهاب الكبد E.", isTF:true, correct:false, explain_ar:"خطأ، مع HBV." },

const sectionExplanations = {
    "Ingestion": { text_ar: `1. الكوليرا: تسبب براز ماء الأرز.\n2. الحمى المعوية (التيفود): تسببها السالمونيلا التيفية، تُشخص بواسطة اختبار ويدال، ويُستخدم لقاح TAB للوقاية.\n3. التسمم الغذائي: تسببه المكورات العنقودية (فترة حضانة قصيرة 1-6 ساعات) أو البوتولينوم (يسبب شللاً تنفسياً من الأطعمة المعلبة).\n4. البروسيلا: تسبب حمى متقطعة ومرتبطة بالحيوانات.\n5. الزحار العصوي: تسببه أنواع الشيجلا.\n6. التهاب الكبد A و E: ينتقلان عن طريق الفم-الشرج (الغذاء والماء الملوث).`, text_en: `1. Cholera: causes rice-water stool.\n2. Enteric fever (Typhoid): caused by Salmonella typhi, diagnosed by Widal test, prevented by TAB vaccine.\n3. Food poisoning: caused by Staphylococcus aureus (short incubation 1-6 hrs) or Clostridium botulinum (causes respiratory paralysis from canned food).\n4. Brucellosis: causes intermittent fever and is associated with animals.\n5. Bacillary dysentery: caused by Shigella species.\n6. Hepatitis A & E: transmitted via fecal-oral route (contaminated food and water).` },
    "Skin & Mucous Membranes": { text_ar: `1. التهاب الحلق واللوزتين: تسببه المكورات العقدية المقيحة.\n2. مضاعفات العقديات: الحمى الروماتيزمية (ASOT) والتهاب الكبيبات.\n3. الدفتيريا: غشاء كاذب، ذيفان، التوكسويد للوقاية.\n4. السعال الديكي: البورديتيلا.\n5. السل: الرذاذ التنفسي.\n6. السيلان والزهري: أمراض جنسية.\n7. الكزاز: المطثية الكزازية (عصا الطبل، لاهوائية).\n8. جمع العينات: مسحات، بلغم صباحي، منتصف البول.`, text_en: `1. Sore throat & tonsillitis: Streptococcus pyogenes.\n2. Streptococcal complications: Rheumatic fever (ASOT) & glomerulonephritis.\n3. Diphtheria: pseudomembrane, toxin, toxoid vaccine.\n4. Whooping cough: Bordetella pertussis.\n5. TB: respiratory droplets.\n6. Gonorrhea & Syphilis: STDs.\n7. Tetanus: Clostridium tetani (drumstick, anaerobic).\n8. Specimen collection: swabs, morning sputum, mid-stream urine.` },
    "Virology": { text_ar: `1. الفيروسات: DNA أو RNA، نانومتر، تتكاثر في الخلايا الحية.\n2. HAV: فموي-شرجي، حاد.\n3. HBV: دم، جنس، ولادة، مزمن، لقاح.\n4. HCV: دم، مزمن، سرطان، لا لقاح.\n5. HDV: مع HBV.\n6. HEV: مائي، شديد بالحوامل.\n7. فيروسات أخرى: شلل الأطفال (القرن الأمامي)، النكاف، الحزام الناري، الهربس.`, text_en: `1. Viruses: DNA or RNA, nm, replicate in living cells.\n2. HAV: fecal-oral, acute.\n3. HBV: blood, sexual, perinatal, chronic, vaccine.\n4. HCV: blood, chronic, HCC, no vaccine.\n5. HDV: with HBV.\n6. HEV: water-borne, severe in pregnancy.\n7. Others: Polio (anterior horn), Mumps, Zoster, Herpes.` },
    "Nosocomial Infections": { text_ar: `1. التعريف: عدوى المستشفى.\n2. المصادر: ذاتية (فلورا المريض) وخارجية (مرضى، عاملين، أدوات).\n3. أكثر المسببات: المكورات العنقودية والزائفة.\n4. عوامل الخطورة: قسطرة بولية، عمليات، كبت مناعة.\n5. الوقاية: غسل اليدين (الأولوية)، تعقيم، عزل، مضادات حيوية رشيدة.`, text_en: `1. Definition: hospital-acquired infection.\n2. Sources: endogenous (patient's flora) & exogenous (patients, staff, devices).\n3. Common agents: Staphylococci & Pseudomonas.\n4. Risk factors: catheterization, surgery, immunosuppression.\n5. Prevention: hand washing (priority), sterilization, isolation, rational antibiotics.` },
    "Immunology & Vaccines": { text_ar: `1. المناعة: فطرية (غير نوعية) وتكيفية (نوعية، ذاكرة).\n2. الخلايا: T السامة (تقتل الخلايا المصابة)، الخلايا البلازمية (تفرز الأجسام المضادة).\n3. الأجسام المضادة: IgM (أولي)، IgG (ثانوي ويعبر المشيمة)، IgA (إفرازات)، IgE (حساسية).\n4. فرط الحساسية: النوع الأول (صدمة تأقية ← IgE)، النوع الثاني (نقل دم غير متوافق).\n5. اللقاحات: BCG (سل حي مضعف)، توكسويد (دفتيريا وكزاز).`, text_en: `1. Immunity: Innate (non-specific) & Adaptive (specific, memory).\n2. Cells: Cytotoxic T (kill infected cells), Plasma cells (secrete antibodies).\n3. Antibodies: IgM (primary), IgG (secondary, crosses placenta), IgA (secretions), IgE (allergy).\n4. Hypersensitivity: Type I (anaphylaxis → IgE), Type II (incompatible blood transfusion).\n5. Vaccines: BCG (live attenuated TB), Toxoid (Diphtheria, Tetanus).` },
    "Bacterial Structure & General Bacteriology": { text_ar: `1. البكتيريا: وحيدة الخلية بدائية النواة.\n2. الهياكل الأساسية: جدار خلوي (شكل)، غشاء سيتوبلازمي (نفاذية)، سيتوبلازم، DNA.\n3. الهياكل الإضافية: محفظة، أسواط (حركة)، شعيرات، أبواغ (مقاومة).\n4. الأشكال: مكورات، عصيات، حلزونيات، ضميات.\n5. النمو: تغذية، رطوبة، غازات، 37°م.\n6. التنفس: هوائي، لاهوائي، اختياري.\n7. التعقيم: أوتوكلاف (121°م/15د)، هواء ساخن (160°م/60د)، بسترة، ترشيح، أكسيد الإيثيلين.\n8. المضادات: مبيد (cidal) أو مثبط (static)، سمية انتخابية.`, text_en: `1. Bacteria: unicellular prokaryotes.\n2. Essential structures: Cell wall (shape), membrane (permeability), cytoplasm, DNA.\n3. Additional: Capsule, Flagella (motility), Pili, Spores (resistance).\n4. Shapes: Cocci, Bacilli, Spiral, Vibrio.\n5. Growth: nutrition, moisture, gases, 37°C.\n6. Respiration: aerobic, anaerobic, facultative.\n7. Sterilization: Autoclave (121°C/15min), Hot air (160°C/60min), Pasteurization, Filtration, Ethylene oxide.\n8. Antibiotics: bactericidal or bacteriostatic, selective toxicity.` }
};

// ========================== STATE & UI ==========================
const LS_KEY = 'microbiology_progress_v5';
let state = { mode:'practice', order:'device', showTranslation:true, timerSeconds:0, quizQuestions:[], currentIndex:0, correctCount:0, wrongCount:0, answered:false, selectedOptionIdx:null, sessionMistakes:[], timerInterval:null, timeLeft:0 };
let maleEnglishVoice = null, currentExplainLang='ar', currentExplainName='';

function setTheme(theme){ document.body.classList.toggle('light',theme==='light'); document.querySelectorAll('.theme-toggle button').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme)); localStorage.setItem('microbiology_theme',theme); }
function loadProgress(){ try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return {attempted:{},mistakes:{}}; return JSON.parse(raw); }catch(e){ return {attempted:{},mistakes:{}}; } }
function saveProgress(p){ localStorage.setItem(LS_KEY,JSON.stringify(p)); }
function qid(sectionName,num){ return sectionName+'___'+num; }

function showExplanation(name){
    currentExplainName=name;
    const box=document.getElementById('section-explanation');
    const title=document.getElementById('explain-title');
    const textDiv=document.getElementById('explain-text');
    const data=sectionExplanations[name];
    title.textContent=name;
    if(!data){ textDiv.textContent=currentExplainLang==='ar'?'لا يوجد شرح':'No explanation.'; box.classList.add('show'); updateExplainTextClass(); return; }
    const txt=currentExplainLang==='ar'?data.text_ar:data.text_en;
    textDiv.innerHTML=txt.replace(/\n/g,'<br>');
    updateExplainTextClass();
    box.classList.add('show');
}
function updateExplainTextClass(){ const td=document.getElementById('explain-text'); td.classList.remove('ar','en'); td.classList.add(currentExplainLang); }
function closeExplanation(){ document.getElementById('section-explanation').classList.remove('show'); }
function setExplainLang(lang){ currentExplainLang=lang; document.querySelectorAll('.explain-controls .lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang)); if(currentExplainName) showExplanation(currentExplainName); }

function updateHomeStats(){
    const p=loadProgress();
    const attemptedKeys=Object.keys(p.attempted||{});
    let correct=0,wrong=0;
    attemptedKeys.forEach(k=>{ if(p.attempted[k]==='correct') correct++; else wrong++; });
    const total=attemptedKeys.length;
    const pct=total?Math.round((correct/total)*100):0;
    document.getElementById('statAttempted').textContent=total;
    document.getElementById('statCorrect').textContent=correct;
    document.getElementById('statWrong').textContent=wrong;
    document.getElementById('progressPercent').innerHTML=pct+'<small>%</small>';
    const circle=document.getElementById('progressCircle');
    circle.style.strokeDashoffset=176-(pct/100)*176;
    updateWeakSectionSuggestion(p);
}
function updateWeakSectionSuggestion(p){
    const attempted=p.attempted||{};
    let bestIdx=-1,bestRate=0,bestName='';
    QUESTION_BANK.forEach((sec,idx)=>{
        let secAttempted=0,secWrong=0;
        sec.questions.forEach(q=>{ const key=qid(sec.name,q.num); if(attempted[key]!==undefined){ secAttempted++; if(attempted[key]==='wrong') secWrong++; } });
        if(secAttempted>=2){ const rate=secWrong/secAttempted; if(rate>bestRate){ bestRate=rate; bestIdx=idx; bestName=sec.name; } }
    });
    const weakLink=document.getElementById('weakLink');
    if(bestIdx>=0 && bestRate>0){ weakLink.style.display='flex'; document.getElementById('weakSectionName').textContent=bestName; document.getElementById('weakSectionRate').textContent=Math.round(bestRate*100)+'%'; weakLink.dataset.sectionIdx=bestIdx; }
    else weakLink.style.display='none';
}

function buildSectionList(){
    const wrap=document.getElementById('section-list');
    wrap.innerHTML='';
    QUESTION_BANK.forEach((sec,idx)=>{
        const div=document.createElement('div');
        div.className='section-item active';
        div.dataset.idx=idx;
        const nameSpan=document.createElement('span');
        nameSpan.textContent=sec.nameEn;
        const infoBtn=document.createElement('button');
        infoBtn.className='info-btn';
        infoBtn.innerHTML='<i class="fas fa-info-circle"></i>';
        infoBtn.title="شرح القسم";
        infoBtn.onclick=(e)=>{ e.stopPropagation(); showExplanation(sec.name); };
        const cntSpan=document.createElement('span');
        cntSpan.className='cnt';
        cntSpan.textContent=sec.sectionTotal||sec.questions.length;
        div.appendChild(nameSpan);
        div.appendChild(infoBtn);
        div.appendChild(cntSpan);
        div.onclick=()=>{ div.classList.toggle('active'); };
        wrap.appendChild(div);
    });
}

function toggleOptions(targetId){ document.querySelectorAll('.sub-options').forEach(el=>el.classList.remove('show')); document.getElementById(targetId).classList.add('show'); document.querySelectorAll('.action-icon').forEach(icon=>icon.classList.remove('active')); const activeIcon=document.querySelector(`.action-icon[data-target="${targetId}"]`); if(activeIcon) activeIcon.classList.add('active'); }
function selectMode(m){ state.mode=m; document.querySelectorAll('#modeOptions .action-btn').forEach(el=>el.classList.toggle('active',el.dataset.mode===m)); document.querySelectorAll('.sub-options').forEach(el=>el.classList.remove('show')); document.querySelectorAll('.action-icon').forEach(icon=>icon.classList.remove('active')); document.querySelector('.action-icon[data-target="modeOptions"]').classList.add('active'); }
function selectOrder(o){ state.order=o; document.querySelectorAll('#orderOptions .action-btn').forEach(el=>el.classList.toggle('active',el.dataset.order===o)); document.querySelectorAll('.sub-options').forEach(el=>el.classList.remove('show')); document.querySelectorAll('.action-icon').forEach(icon=>icon.classList.remove('active')); document.querySelector('.action-icon[data-target="orderOptions"]').classList.add('active'); }
function selectTranslate(t){ state.showTranslation=(t==='yes'); document.querySelectorAll('#langOptions .action-btn').forEach(el=>el.classList.toggle('active',el.dataset.translate===t)); document.querySelectorAll('.sub-options').forEach(el=>el.classList.remove('show')); document.querySelectorAll('.action-icon').forEach(icon=>icon.classList.remove('active')); document.querySelector('.action-icon[data-target="langOptions"]').classList.add('active'); }
function selectTimer(sec){ state.timerSeconds=sec; document.querySelectorAll('#timerOptions .action-btn').forEach(el=>el.classList.toggle('active',parseInt(el.dataset.timer)===sec)); document.querySelectorAll('.sub-options').forEach(el=>el.classList.remove('show')); document.querySelectorAll('.action-icon').forEach(icon=>icon.classList.remove('active')); document.querySelector('.action-icon[data-target="timerOptions"]').classList.add('active'); }

function enterApp(){ document.getElementById('main-screen').style.display='block'; buildSectionList(); updateHomeStats(); const savedTheme=localStorage.getItem('microbiology_theme')||'dark'; setTheme(savedTheme); if(window.speechSynthesis){ window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged=()=>{ window.speechSynthesis.getVoices(); maleEnglishVoice=null; }; } }
function goHome(){ stopTimer(); document.getElementById('screen-quiz').classList.remove('active'); document.getElementById('screen-results').classList.remove('active'); document.getElementById('main-screen').style.display='block'; updateHomeStats(); }
function quitQuiz(){ if(confirm('متأكد تخرج؟')){ stopTimer(); goHome(); } }
function resetProgress(){ if(confirm('متأكد تصفير التقدم؟')){ localStorage.removeItem(LS_KEY); updateHomeStats(); } }

function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function startQuiz(){
    const activeSecEls=document.querySelectorAll('#section-list .section-item.active');
    if(activeSecEls.length===0){ alert('اختار جزء واحد على الأقل!'); return; }
    const activeIdxs=Array.from(activeSecEls).map(el=>parseInt(el.dataset.idx));
    let qs=[]; activeIdxs.forEach(idx=>{ const sec=QUESTION_BANK[idx]; sec.questions.forEach(q=>{ qs.push(Object.assign({},q,{sectionName:sec.name})); }); });
    if(qs.length===0){ alert('هذا القسم لا يحتوي على أسئلة!'); return; }
    if(state.order==='random') qs=shuffleArray(qs);
    state.quizQuestions=qs;
    state.currentIndex=0;
    state.correctCount=0;
    state.wrongCount=0;
    state.sessionMistakes=[];
    document.getElementById('main-screen').style.display='none';
    document.getElementById('screen-quiz').classList.add('active');
    document.getElementById('screen-results').classList.remove('active');
    renderQuestion();
}
function reviewMistakes(){
    const p=loadProgress();
    const mistakeKeys=Object.keys(p.mistakes||{});
    if(mistakeKeys.length===0){ alert('مفيش أخطاء للمراجعة 🎉'); return; }
    let qs=[]; QUESTION_BANK.forEach(sec=>{ sec.questions.forEach(q=>{ const key=qid(sec.name,q.num); if(mistakeKeys.includes(key)) qs.push(Object.assign({},q,{sectionName:sec.name})); }); });
    state.quizQuestions=qs;
    state.currentIndex=0; state.correctCount=0; state.wrongCount=0; state.sessionMistakes=[]; state.mode='practice';
    document.getElementById('main-screen').style.display='none';
    document.getElementById('screen-quiz').classList.add('active');
    document.getElementById('screen-results').classList.remove('active');
    renderQuestion();
}
function startWeakSectionQuiz(){
    const weakLink=document.getElementById('weakLink');
    const idx=weakLink.dataset.sectionIdx;
    if(idx===undefined) return;
    document.querySelectorAll('#section-list .section-item').forEach(el=>{ el.classList.toggle('active',el.dataset.idx==idx); });
    startQuiz();
}

function renderQuestion(){
    state.answered=false; state.selectedOptionIdx=null;
    const total=state.quizQuestions.length;
    const q=state.quizQuestions[state.currentIndex];
    document.getElementById('quiz-position').innerHTML=`<i class="fas fa-question-circle"></i> ${state.currentIndex+1} / ${total}`;
    document.getElementById('quiz-score').innerHTML=`<i class="fas fa-check-circle" style="color:var(--success);"></i> ${state.correctCount} <i class="fas fa-times-circle" style="color:var(--danger);margin-right:4px;"></i> ${state.wrongCount}`;
    document.getElementById('progress-bar').style.width=((state.currentIndex)/total*100)+'%';
    let tagText=`<i class="fas fa-tag"></i> ${q.sectionName}`;
    if(q.isTF) tagText+=` <span class="tf-badge">صواب / خطأ</span>`;
    document.getElementById('q-section-tag').innerHTML=tagText;
    const qEnContainer=document.getElementById('q-en'); wrapEnglishText(`${q.num}. ${q.en}`,qEnContainer);
    const qArEl=document.getElementById('q-ar'); qArEl.textContent=q.ar||''; qArEl.style.display=state.showTranslation&&q.ar?'block':'none';
    const optsWrap=document.getElementById('options'); optsWrap.innerHTML='';
    if(q.isTF){
        const tfOptions=[{en:"True",ar:"صواب"},{en:"False",ar:"خطأ"}];
        tfOptions.forEach((opt,i)=>{
            const div=document.createElement('div'); div.className='option'; div.dataset.idx=i;
            const isCorrect=(i===0)?q.correct===true:q.correct===false;
            div.dataset.correct=isCorrect?'true':'false';
            const enDiv=document.createElement('div'); enDiv.className='opt-en'; wrapEnglishText(opt.en,enDiv);
            const arDiv=document.createElement('div'); arDiv.className='opt-ar'; arDiv.textContent=opt.ar||''; arDiv.style.display=state.showTranslation&&opt.ar?'block':'none';
            const markSpan=document.createElement('span'); markSpan.className='mark';
            div.appendChild(enDiv); div.appendChild(arDiv); div.appendChild(markSpan);
            div.onclick=()=>onOptionClick(i); optsWrap.appendChild(div);
        });
    } else {
        q.options.forEach((opt,i)=>{
            const div=document.createElement('div'); div.className='option'; div.dataset.idx=i; div.dataset.correct=opt.correct?'true':'false';
            const enDiv=document.createElement('div'); enDiv.className='opt-en'; wrapEnglishText(opt.en,enDiv);
            const arDiv=document.createElement('div'); arDiv.className='opt-ar'; arDiv.textContent=opt.ar||''; arDiv.style.display=state.showTranslation&&opt.ar?'block':'none';
            const markSpan=document.createElement('span'); markSpan.className='mark';
            div.appendChild(enDiv); div.appendChild(arDiv); div.appendChild(markSpan);
            div.onclick=()=>onOptionClick(i); optsWrap.appendChild(div);
        });
    }
    document.getElementById('feedback').classList.add('hidden'); document.getElementById('feedback').innerHTML='';
    const nextBtn=document.getElementById('btn-next');
    const isLast=state.currentIndex===total-1;
    const finishLabel=isLast?'إنهاء ✅':'التالي ⬅️';
    if(state.mode==='test'){
        nextBtn.disabled=true;
        nextBtn.innerHTML=`<i class="fas fa-arrow-left"></i> ${finishLabel}`;
        nextBtn.onclick=()=>{
            if(state.selectedOptionIdx===null) return;
            stopTimer();
            const q2=state.quizQuestions[state.currentIndex];
            let isCorrect=false;
            if(q2.isTF){ const opt=document.querySelector(`.option[data-idx="${state.selectedOptionIdx}"]`); isCorrect=opt.dataset.correct==='true'; }
            else { isCorrect=!!q2.options[state.selectedOptionIdx].correct; }
            recordAnswer(isCorrect,[state.selectedOptionIdx]);
            goToNextOrFinish();
        };
    } else {
        nextBtn.disabled=true;
        nextBtn.innerHTML=`<i class="fas fa-arrow-left"></i> ${finishLabel}`;
        nextBtn.onclick=()=>nextQuestion();
    }
    startTimer();
}
function onOptionClick(i){
    if(state.answered) return;
    state.selectedOptionIdx=i;
    document.querySelectorAll('.option').forEach(el=>el.classList.remove('selected'));
    document.querySelector(`.option[data-idx="${i}"]`).classList.add('selected');
    if(state.mode==='test'){ document.getElementById('btn-next').disabled=false; }
    else { submitSingleAnswer(i); }
}
function submitSingleAnswer(i){
    const q=state.quizQuestions[state.currentIndex];
    let isCorrect=false;
    if(q.isTF){ const opt=document.querySelector(`.option[data-idx="${i}"]`); isCorrect=opt.dataset.correct==='true'; }
    else { isCorrect=!!q.options[i].correct; }
    finalizeAnswer(isCorrect,[i]);
}
function recordAnswer(isCorrect,chosenIdxs){
    stopTimer(); state.answered=true;
    const q=state.quizQuestions[state.currentIndex];
    if(isCorrect) state.correctCount++; else state.wrongCount++;
    const p=loadProgress();
    const key=qid(q.sectionName,q.num);
    p.attempted=p.attempted||{}; p.mistakes=p.mistakes||{};
    p.attempted[key]=isCorrect?'correct':'wrong';
    if(isCorrect) delete p.mistakes[key]; else p.mistakes[key]=true;
    saveProgress(p);
    if(!isCorrect) state.sessionMistakes.push({q,chosenIdxs});
}
function goToNextOrFinish(){
    if(state.currentIndex<state.quizQuestions.length-1){ state.currentIndex++; renderQuestion(); }
    else showResults();
}
function finalizeAnswer(isCorrect,chosenIdxs){
    stopTimer(); state.answered=true;
    const q=state.quizQuestions[state.currentIndex];
    document.querySelectorAll('.option').forEach((el)=>{
        const idx=parseInt(el.dataset.idx);
        el.classList.add('disabled');
        const isCorrectOption=el.dataset.correct==='true';
        if(isCorrectOption){ el.classList.add('correct'); el.querySelector('.mark').textContent='✅'; }
        else if(chosenIdxs.includes(idx)){ el.classList.add('wrong'); el.querySelector('.mark').textContent='❌'; }
    });
    if(isCorrect) state.correctCount++; else state.wrongCount++;
    const p=loadProgress(); const key=qid(q.sectionName,q.num);
    p.attempted=p.attempted||{}; p.mistakes=p.mistakes||{};
    p.attempted[key]=isCorrect?'correct':'wrong';
    if(isCorrect) delete p.mistakes[key]; else p.mistakes[key]=true;
    saveProgress(p);
    if(!isCorrect) state.sessionMistakes.push({q,chosenIdxs});
    document.getElementById('quiz-score').innerHTML=`<i class="fas fa-check-circle" style="color:var(--success);"></i> ${state.correctCount} <i class="fas fa-times-circle" style="color:var(--danger);margin-right:4px;"></i> ${state.wrongCount}`;
    if(state.mode==='practice'){
        const fb=document.getElementById('feedback'); fb.classList.remove('hidden'); fb.className='feedback-box '+(isCorrect?'correct':'wrong');
        let correctLabels='';
        if(q.isTF){ correctLabels=q.correct?'True (صواب)':'False (خطأ)'; }
        else { correctLabels=q.options.map((o,i)=>o.correct?o.en:null).filter(Boolean).join('، '); }
        fb.innerHTML=`<div class="fb-title">${isCorrect?'✅ صحيحة!':'❌ غلط'}</div>${!isCorrect?`<div><b>الصح:</b> ${correctLabels}</div>`:''}<div class="fb-explain">💡 ${q.explain_ar||''}</div>`;
    }
    const nextBtn=document.getElementById('btn-next');
    nextBtn.disabled=false;
    const isLast=state.currentIndex===state.quizQuestions.length-1;
    nextBtn.innerHTML=isLast?`<i class="fas fa-flag-checkered"></i> إنهاء`:`<i class="fas fa-arrow-left"></i> التالي`;
    nextBtn.onclick=()=>nextQuestion();
}
function nextQuestion(){ if(!state.answered) return; if(state.currentIndex<state.quizQuestions.length-1){ state.currentIndex++; renderQuestion(); } else showResults(); }

function showResults(){
    document.getElementById('screen-quiz').classList.remove('active');
    document.getElementById('screen-results').classList.add('active');
    document.getElementById('mistakes-list-wrap').classList.add('hidden');
    const total=state.quizQuestions.length;
    const pct=total?Math.round((state.correctCount/total)*100):0;
    document.getElementById('result-pct').textContent=pct+'%';
    document.getElementById('score-circle').style.setProperty('--pct',pct);
    document.getElementById('res-total').textContent=total;
    document.getElementById('res-correct').textContent=state.correctCount;
    document.getElementById('res-wrong').textContent=state.wrongCount;
    document.getElementById('btn-show-mistakes').classList.toggle('hidden',state.sessionMistakes.length===0);
}
function showMistakesList(){
    const wrap=document.getElementById('mistakes-list-wrap');
    const list=document.getElementById('mistakes-list'); list.innerHTML='';
    state.sessionMistakes.forEach((m)=>{
        const q=m.q;
        let yourAnswers='', correctAnswers='';
        if(q.isTF){
            yourAnswers=m.chosenIdxs.map(i=>document.querySelector(`.option[data-idx="${i}"] .opt-en`)?.textContent||'').join('، ');
            correctAnswers=q.correct?'True (صواب)':'False (خطأ)';
        } else {
            yourAnswers=m.chosenIdxs.map(i=>q.options[i].en).join('، ');
            correctAnswers=q.options.map((o,i)=>o.correct?o.en:null).filter(Boolean).join('، ');
        }
        const div=document.createElement('div'); div.className='mistake-item';
        const toggleBtn=document.createElement('button'); toggleBtn.className='mistake-toggle'; toggleBtn.innerHTML='<i class="fas fa-eye"></i> عرض السؤال';
        const detailDiv=document.createElement('div'); detailDiv.className='mistake-detail'; detailDiv.style.display='none';
        const qHeader=document.createElement('div'); qHeader.style.fontWeight='bold'; qHeader.style.marginBottom='8px'; qHeader.textContent=`${q.num}. ${q.en}`;
        detailDiv.appendChild(qHeader);
        const optsDiv=document.createElement('div');
        if(q.isTF){
            const tfOptions=[{en:"True (صواب)",correct:q.correct===true},{en:"False (خطأ)",correct:q.correct===false}];
            tfOptions.forEach((opt,i)=>{
                const row=document.createElement('div'); row.className='opt-row';
                const label=document.createElement('span'); label.className='opt-label'; label.textContent=opt.en;
                const status=document.createElement('span'); status.className='opt-status';
                if(opt.correct){ status.textContent='✅'; status.style.color='var(--success)'; }
                else if(m.chosenIdxs.includes(i)){ status.textContent='❌'; status.style.color='var(--danger)'; }
                else { status.textContent='—'; status.style.color='var(--muted)'; }
                row.appendChild(label); row.appendChild(status); optsDiv.appendChild(row);
            });
        } else {
            q.options.forEach((opt,i)=>{
                const row=document.createElement('div'); row.className='opt-row';
                const label=document.createElement('span'); label.className='opt-label'; label.textContent=opt.en;
                const status=document.createElement('span'); status.className='opt-status';
                if(opt.correct){ status.textContent='✅'; status.style.color='var(--success)'; }
                else if(m.chosenIdxs.includes(i)){ status.textContent='❌'; status.style.color='var(--danger)'; }
                else { status.textContent='—'; status.style.color='var(--muted)'; }
                row.appendChild(label); row.appendChild(status); optsDiv.appendChild(row);
            });
        }
        detailDiv.appendChild(optsDiv);
        const explainDiv=document.createElement('div'); explainDiv.style.marginTop='8px'; explainDiv.style.fontStyle='italic'; explainDiv.style.color='var(--muted)'; explainDiv.textContent=`💡 ${q.explain_ar||''}`;
        detailDiv.appendChild(explainDiv);
        toggleBtn.onclick=()=>{ const isVisible=detailDiv.style.display!=='none'; detailDiv.style.display=isVisible?'none':'block'; toggleBtn.innerHTML=isVisible?'<i class="fas fa-eye"></i> عرض السؤال':'<i class="fas fa-eye-slash"></i> إخفاء السؤال'; };
        div.innerHTML=`<div class="m-q">${q.num}. ${q.en}</div><div class="m-you">إجابتك: ${yourAnswers}</div><div class="m-correct">الصح: ${correctAnswers}</div>`;
        div.appendChild(toggleBtn); div.appendChild(detailDiv); list.appendChild(div);
    });
    wrap.classList.remove('hidden'); wrap.scrollIntoView({behavior:'smooth'});
}
function stopTimer(){ if(state.timerInterval){ clearInterval(state.timerInterval); state.timerInterval=null; } const badge=document.getElementById('timer-badge'); badge.classList.add('hidden'); badge.classList.remove('warn','danger'); }
function startTimer(){
    stopTimer();
    if(!state.timerSeconds||state.timerSeconds<=0) return;
    const badge=document.getElementById('timer-badge');
    state.timeLeft=state.timerSeconds;
    badge.classList.remove('hidden','warn','danger');
    badge.innerHTML=`<i class="fas fa-hourglass-half"></i> ${state.timeLeft}`;
    state.timerInterval=setInterval(()=>{
        state.timeLeft--;
        if(state.timeLeft<=0){ badge.innerHTML=`<i class="fas fa-hourglass-end"></i> 0`; stopTimer(); onTimeUp(); return; }
        badge.innerHTML=`<i class="fas fa-hourglass-half"></i> ${state.timeLeft}`;
        badge.classList.toggle('warn',state.timeLeft<=3&&state.timeLeft>1);
        badge.classList.toggle('danger',state.timeLeft<=1);
    },1000);
}
function onTimeUp(){
    if(state.answered) return;
    const q=state.quizQuestions[state.currentIndex];
    const chosen=state.selectedOptionIdx!==null?[state.selectedOptionIdx]:[];
    if(state.mode==='test'){ recordAnswer(false,chosen); goToNextOrFinish(); }
    else { finalizeAnswer(false,chosen); }
}
function getMaleEnglishVoice(){
    if(maleEnglishVoice) return maleEnglishVoice;
    const voices=window.speechSynthesis.getVoices();
    let voice=voices.find(v=>v.lang==='en-US'&&v.name.toLowerCase().includes('male'));
    if(!voice) voice=voices.find(v=>v.lang==='en-GB'&&v.name.toLowerCase().includes('male'));
    if(!voice) voice=voices.find(v=>v.lang.startsWith('en')&&v.name.toLowerCase().includes('male'));
    if(!voice) voice=voices.find(v=>v.lang.startsWith('en'));
    maleEnglishVoice=voice; return voice;
}
function speakWord(word){
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance=new SpeechSynthesisUtterance(word);
    utterance.lang='en-US'; utterance.rate=0.7; utterance.pitch=1; utterance.volume=1;
    const voice=getMaleEnglishVoice(); if(voice) utterance.voice=voice;
    window.speechSynthesis.speak(utterance);
}
function wrapEnglishText(text,container){
    if(!container) return;
    container.innerHTML='';
    if(!text) return;
    const words=text.split(' ');
    words.forEach((word,idx)=>{
        if(word.trim()===''){ container.appendChild(document.createTextNode(' ')); return; }
        const span=document.createElement('span'); span.className='word-en'; span.textContent=word;
        let pressTimer=null;
        const startPress=()=>{ pressTimer=setTimeout(()=>{ speakWord(word); span.classList.add('speaking'); setTimeout(()=>span.classList.remove('speaking'),600); const hint=document.getElementById('speech-hint'); hint.textContent=`🔊 ${word}`; hint.classList.add('show'); setTimeout(()=>hint.classList.remove('show'),1000); },1000); };
        const endPress=()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
        span.addEventListener('pointerdown',startPress);
        span.addEventListener('pointerup',endPress);
        span.addEventListener('pointerleave',endPress);
        span.addEventListener('touchstart',startPress,{passive:true});
        span.addEventListener('touchend',endPress,{passive:true});
        span.addEventListener('touchcancel',endPress,{passive:true});
        container.appendChild(span);
        if(idx<words.length-1) container.appendChild(document.createTextNode(' '));
    });
}
document.addEventListener('click',function(e){
    const btn=e.target.closest('.big-btn');
    if(!btn) return;
    const rect=btn.getBoundingClientRect();
    const ripple=document.createElement('span'); ripple.className='ripple';
    const size=Math.max(rect.width,rect.height);
    ripple.style.width=ripple.style.height=size+'px';
    ripple.style.left=(e.clientX-rect.left-size/2)+'px';
    ripple.style.top=(e.clientY-rect.top-size/2)+'px';
    btn.appendChild(ripple);
    setTimeout(()=>ripple.remove(),500);
});
document.addEventListener('DOMContentLoaded',()=>{ enterApp(); });
</script>
